services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: tpvgallega
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - tpvgallega-db-data:/var/lib/postgresql/data

volumes:
  tpvgallega-db-data:
